<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeDrive 와이어프레임 (사이트맵 기준 8화면)</title>
<style>
:root{--bg:#e8e8e3;--pn:#fff;--ln:#222;--mu:#777;--ph:#d9d9d2;--rd:#c0282d;--dk:#161616;--dkt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--pn:#2a2a27;--ln:#ddd;--mu:#999;--ph:#444440;--rd:#ff6b6f;--dk:#eee;--dkt:#111}}
:root[data-theme="dark"]{--bg:#1d1d1b;--pn:#2a2a27;--ln:#ddd;--mu:#999;--ph:#444440;--rd:#ff6b6f;--dk:#eee;--dkt:#111}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ln);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px;word-break:keep-all}.sub{color:var(--mu);font-size:13px;margin:0 0 20px;word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px 30px}
.hd{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ln);padding-bottom:8px;margin-bottom:14px}
.hd b{border:2px solid var(--ln);padding:0 6px;font-size:15px;white-space:nowrap}.hd span{margin-left:auto;color:var(--mu);font-size:12px;white-space:nowrap}.hd strong{font-size:16px;white-space:nowrap}
.fr{background:var(--pn);border:1px solid var(--ln)}
.bar{height:12px;background:var(--ph)}
.nav{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);font-size:13px;position:relative}
.nav .bk{font-size:15px}.nav b{font-size:14px;font-weight:700;white-space:nowrap}
.sec{padding:12px 14px;border-bottom:1px solid var(--ln);position:relative}.sec:last-child{border-bottom:0}
.n{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--pn);border:1.5px solid var(--rd);color:var(--rd);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.mu{color:var(--mu);font-size:12px;word-break:keep-all}.t1{font-weight:700;font-size:15px;word-break:keep-all}
.in{border:1px solid var(--mu);background:var(--ph);padding:8px 10px;color:var(--mu);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}.row.f{margin:0}
.chip{border:1px solid var(--ln);padding:3px 9px;font-size:12px;background:var(--pn);white-space:nowrap}
.chip.on{background:var(--dk);color:var(--dkt)}.chip.bd{border-style:dashed;color:var(--mu)}.chip.gr{color:var(--mu);border-color:var(--mu);background:var(--ph)}
.btn{border:1px solid var(--ln);padding:9px;text-align:center;background:var(--ph);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.dk{background:var(--dk);color:var(--dkt)}.btn.off{opacity:.45}
.img{background:var(--ph);position:relative;min-height:56px;border:1px solid var(--mu)}
.img:after{content:"IMG";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mu)}
.card{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--mu);align-items:flex-start}.card:last-child{border-bottom:0}
.card>div:nth-child(1){flex:1;min-width:0}
.card>div:nth-child(1) b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card>div:nth-child(1) .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bg{display:inline-block;border:1px solid var(--ln);padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;flex:none}
.bg.r1{background:#2e7d32;color:#fff;border-color:#2e7d32}
.bg.r2{background:#f2c200;color:#111;border-color:#f2c200}
.bg.r3{background:#ef7d1a;color:#fff;border-color:#ef7d1a}
.bg.r4{background:#c0282d;color:#fff;border-color:#c0282d}
.star{border:1px solid var(--ln);width:24px;height:24px;text-align:center;font-size:12px;line-height:22px;flex:none}
.nt{margin:16px 0 0;padding:0;list-style:none}
.nt li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--mu)}
.nt .nb{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rd);color:var(--rd);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.nt b{display:block;font-size:13px;word-break:keep-all}.nt span{font-size:12px;color:var(--mu);word-break:keep-all}.nt em{color:var(--rd);font-style:normal;font-weight:700}
.tabw{position:relative;border-top:2px solid var(--ln)}
.tabs{display:flex;position:relative;background:var(--pn)}
.tabs div{flex:1;text-align:center;padding:8px 0 7px;font-size:11px;color:var(--mu);border-right:1px solid var(--ph)}
.tabs div:last-of-type{border-right:0}.tabs div i{display:block;font-style:normal;font-size:16px;line-height:1.2}
.tabs div.on{color:var(--ln);font-weight:700;background:var(--ph)}
.top{position:absolute;right:12px;top:-54px;width:42px;height:42px;border-radius:50%;background:var(--dk);color:var(--dkt);font-size:15px;line-height:1.05;text-align:center;padding-top:6px;z-index:3}
.top small{display:block;font-size:8px;font-weight:700}
.top .n{right:-8px;top:-8px;transform:none;width:20px;height:20px;font-size:11px}
.state{display:inline-block;background:var(--dk);color:var(--dkt);font-size:11px;padding:2px 9px;margin-bottom:8px;white-space:nowrap}
.state.err{background:var(--rd)}
.legend{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--mu)}
.legend:last-child{border-bottom:0}
.legend b{white-space:nowrap}
</style></head><body><div class="wrap">
<h1>SafeDrive · 와이어프레임 (사이트맵 기준 8화면)</h1>
<p class="sub">홈 · 위험구간목록(결과있음/결과없음·오류) · 구간상세 · 위험등급 안내 · 마이(즐겨찾기/최근검색) · 필터·정렬 바텀시트 — 모바일 화면 · 하단 탭 바 + TOP 버튼 포함 · 빨간 번호 = 아래 설명 번호 · 로그인 없음(전 화면 LocalStorage 기반)</p>
<div class="grid" id="g"></div></div>
<script>
const img=(h)=>`<div class="img" style="min-height:${h||60}px"></div>`;
const riskBg=(lv)=>`<span class="bg r${lv}">${lv}등급</span>`;
const routeCard=(route,meta,badge,star)=>`<div class="card"><div><b>${route}</b><div class="mu">${meta}</div></div>${badge||''}${star?`<span class="star">${star}</span>`:''}</div>`;
const segCard=(name,meta,badge)=>`<div class="card">${img(56)}<div style="flex:1"><b>${name}</b><div class="mu">${meta}</div></div>${badge}</div>`;

const S=[
{no:1,t:'홈',s:'탭 루트 · 로그인 불필요',back:false,secs:[
 `<div class="t1">초행길도 안심하고,<br>사고 위험도 낮은 길로</div><div class="mu">출발지·도착지만 입력하면 위험구간을 피해 알려드려요</div>`,
 `<div class="mu">출발지</div><div class="in">출발지 입력 (예: 강남역)</div>`,
 `<div class="mu">도착지</div><div class="in">도착지 입력 (예: 잠실역)</div>`,
 `<div class="row f"><span class="chip">기본</span><span class="chip on">안전우선</span><span class="chip">4등급 제외</span></div>`,
 `<div class="btn dk">경로 탐색하기</div>`,
 `<div class="mu">최근 검색 / 즐겨찾기 경로</div>`+routeCard('강남역 → 잠실역','안전우선 모드 · 위험구간 0곳','','')+routeCard('역삼동 → 선릉역','기본 모드 · 위험구간 2곳 포함','','★')],
n:[['서비스명 · 가치 제안','정적 문구. 3주차 가치 제안을 사용자 언어로 축약'],['출발지 · 도착지 입력','데이터 <em>origin·destination</em>(문자열). 입력 전 텍스트 입력창 상태, 둘 다 입력해야 탐색 버튼 활성화'],['모드 선택','데이터 <em>routeMode</em>(지정값: 기본/안전우선/4등급제외). 토글 시 다음 화면 결과에 즉시 반영'],['경로탐색 버튼','탭하면 origin·destination·routeMode를 들고 위험구간목록으로 이동'],['최근검색 · 즐겨찾기 미리보기','데이터 <em>recentSearch[]·favoriteRoute[]</em> — origin, destination, routeMode (LocalStorage 저장). 2~3건만 미리보기, 전체는 마이에서 확인']]},

{no:2,t:'위험구간목록',s:'탭 루트 · 결과 있음 · 로그인 불필요',back:false,secs:[
 `<div class="row f"><b>강남역 → 잠실역</b><span class="mu" style="margin-left:auto">(수정)</span></div>`,
 `<div class="row f"><span class="chip">위험등급 ▾</span><span class="chip">도로유형 ▾</span><span class="chip">사고많은순 ▾</span></div>`,
 `<div class="mu">총 6개 구간 · 위험구간 2곳 포함</div>`,
 segCard('테헤란로 1번 구간','대로 · 사고 12건',riskBg(4))+segCard('언주로 교차 구간','이면도로 · 사고 3건',riskBg(2))+segCard('잠실대로 구간','대로 · 사고 1건',riskBg(1))],
n:[['조건 요약 바','데이터 <em>origin·destination</em>(문자열). 탭하면 홈으로 돌아가 재입력'],['필터 · 정렬','데이터 <em>riskLevel</em>(지정값 1~4, 필터) · <em>roadType</em>(지정값, 필터) · <em>sortBy</em>(지정값: 사고많은순/기본, 정렬)'],['결과 건수','데이터 <em>resultCount·highRiskCount</em>(숫자). 필터 변경 시 즉시 갱신'],['구간 카드 · 위험등급 배지','데이터 <em>segmentId</em>(숨김, 상세 진입) · <em>roadName·roadType·accidentCount·riskLevel</em>. 배지 색상 고정 — 4등급 <em>빨강</em>(매우위험) · 3등급 <em>주황</em> · 2등급 <em>노랑</em> · 1등급 <em>초록</em>(안전)'],['리스트 스크롤','추가 <em>segmentId</em> 항목이 무한 스크롤로 반복 렌더링']]},

{no:3,t:'위험구간목록',s:'결과없음 · 오류 (같은 화면 재사용)',back:false,secs:[
 `<div class="state">상태: 결과없음</div><div class="t1" style="font-size:13px">조건에 맞는 구간이 없습니다</div><div class="btn" style="margin-top:8px">마지막 조건 해제</div>`,
 `<div class="state err">상태: 오류</div><div class="t1" style="font-size:13px">경로·위험구간 데이터를 불러오지 못했습니다</div><div class="btn" style="margin-top:8px">다시 시도</div>`,
 `<div class="mu">※ 오류 상태에서도 즐겨찾기·최근검색(LocalStorage)은 그대로 유지됩니다</div>`],
n:[['결과없음 상태','데이터 <em>screenState</em>(지정값: 결과없음). 필터 3개 이상 중첩으로 0건일 때 표시, 마지막 적용 필터를 해제하는 행동 제공'],['오류 상태','데이터 <em>screenState</em>(지정값: 오류). 사고 데이터·지도 API 로드 실패 시 표시, 다시 시도 버튼으로 재요청'],['데이터 보존 원칙','두 상태 모두 <em>favoriteRoute[]·recentSearch[]</em>(LocalStorage) 값은 오류와 무관하게 그대로 유지']]},

{no:4,t:'구간상세',s:'푸시 · 탭바 숨김 · 외부 API 의존(심화)',back:true,secs:[
 img(140),
 `<div class="row f"><div class="t1">테헤란로 1번 구간</div>${riskBg(4)}</div>`,
 `<div class="mu">사고건수: 12건 (최근 3년)<br>도로유형: 대로 · 왕복 6차로<br>주소: 서울 강남구 테헤란로 일대</div>`,
 `<div class="mu">사고 유형 요약 (심화)</div><div style="margin-top:4px">추돌 7건 · 좌회전 3건 · 보행자 2건</div>`,
 `<div class="btn dk">이 구간 피해서 경로 다시 찾기</div>`,
 `<div class="btn">☆ 즐겨찾기 저장</div>`],
n:[['지도 뷰','외부 API 의존(심화 트랙 핵심). 데이터 <em>lat/lng</em>(숫자)로 구간 경로 라인 렌더링(Naver Maps API). API 응답 실패 시에도 아래 텍스트 정보만으로 판단 가능해야 함 — 심화 트랙 필수 폴백 조건'],['도로명 · 위험등급 배지','데이터 <em>roadName·riskLevel</em>(지정값 1~4). 배지 색상은 목록과 동일하게 고정'],['사고건수 · 도로유형 · 주소','데이터 <em>accidentCount·roadType·address</em> — 모두 정적 JSON 상세 데이터'],['사고 유형 요약 (심화)','데이터 <em>accidentTypeBreakdown{}</em>(지정값 집계). 공공데이터에 세부 항목이 없으면 영역 자체를 숨김'],['재탐색 버튼','현재 구간을 제외 조건으로 위험구간목록을 다시 호출(기능)'],['즐겨찾기 저장','데이터 <em>isFavorite</em>(참거짓). 토글 시 LocalStorage <em>favoriteRoute[]</em>에 segmentId 추가·삭제']]},

{no:5,t:'위험등급 안내',s:'정보 모달 · 어디서나 호출 가능',back:true,secs:[
 `<div class="t1">위험등급은 어떻게 계산되나요?</div><div class="mu">도로교통공단 공공 사고 데이터를 기준으로 산출됩니다</div>`,
 `<div class="legend">${riskBg(4)}<div><b style="font-size:13px">매우위험</b><div class="mu">사고 다발 구간. 가능하면 우회를 권장해요</div></div></div>`,
 `<div class="legend">${riskBg(3)}<div><b style="font-size:13px">위험</b><div class="mu">사고 발생 이력이 있는 구간이에요</div></div></div>`,
 `<div class="legend">${riskBg(2)}<div><b style="font-size:13px">주의</b><div class="mu">사고 건수가 적지만 유의가 필요해요</div></div></div>`,
 `<div class="legend">${riskBg(1)}<div><b style="font-size:13px">안전</b><div class="mu">최근 3년간 사고 이력이 거의 없어요</div></div></div>`,
 `<div class="btn dk">닫기</div>`],
n:[['설명 문구','정적 콘텐츠, 데이터 항목 없음. 초행길 운전자도 등급 기준을 바로 이해하도록 구성'],['등급 4종 · 색상 범례','데이터 항목 없음(고정 색상 매핑: 4=빨강, 3=주황, 2=노랑, 1=초록). 목록·상세 화면의 배지 옆 "?" 아이콘으로 호출'],['닫기','이전 화면(목록 또는 상세)으로 그대로 복귀, 화면 상태는 유지됨']]},

{no:6,t:'마이',s:'탭 루트 · 즐겨찾기 탭 · 로그인 불필요',back:false,secs:[
 `<div class="row f"><span class="chip on">즐겨찾기</span><span class="chip">최근검색</span></div>`,
 routeCard('강남역 → 잠실역','안전우선 모드 · 위험구간 0곳 · 저장일 10/08','','')+routeCard('역삼동 → 선릉역','기본 모드 · 위험구간 2곳 포함 · 저장일 10/05','',''),
 `<div class="btn" style="margin-top:4px">선택 항목 저장 해제</div>`,
 `<div class="mu" style="margin-top:12px">※ 저장없음 상태 — "경로를 즐겨찾기에 저장해보세요" + 위험구간목록 이동 버튼</div>`],
n:[['탭 전환','데이터 <em>activeTab</em>(지정값: 즐겨찾기/최근검색, 필터). 데이터는 LocalStorage에서만 로드(서버 없음)'],['즐겨찾기 카드','데이터 <em>favoriteRoute[]</em>: origin·destination·routeMode·highRiskCount·savedAt(저장일순 정렬). 카드 탭 시 구간상세 화면을 그대로 재사용'],['저장 해제','다중 선택 후 LocalStorage 배열에서 선택 항목 제거'],['저장없음 상태','데이터 <em>screenState</em>(지정값: 저장없음). favoriteRoute[]가 빈 배열일 때 노출']]},

{no:7,t:'마이',s:'탭 루트 · 최근검색 탭 · 로그인 불필요',back:false,secs:[
 `<div class="row f"><span class="chip">즐겨찾기</span><span class="chip on">최근검색</span></div>`,
 routeCard('강남역 → 잠실역','검색 10/12 18:42','','')+routeCard('역삼동 → 선릉역','검색 10/10 09:15','','')+routeCard('잠실대로 → 송파구청','검색 10/07 21:03','',''),
 `<div class="mu" style="margin-top:12px">최대 10건, 검색 시각순 보관 · 저장없음 상태 — "최근 검색 기록이 없어요"</div>`],
n:[['탭 전환','위와 동일 — <em>activeTab</em> 지정값'],['최근 검색 목록','데이터 <em>recentSearch[]</em>: origin·destination·searchedAt. 최대 10건 유지, 초과분은 가장 오래된 항목부터 삭제'],['항목 탭','동일 조건(origin·destination·routeMode)으로 위험구간목록을 바로 재탐색'],['저장없음 상태','recentSearch[]가 빈 배열일 때 안내 문구만 노출']]},

{no:8,t:'필터 · 정렬',s:'바텀시트(전체화면) · 위험구간목록에서 호출',back:true,secs:[
 `<div class="t1">필터</div>`,
 `<div class="mu">위험등급</div><div class="row f"><span class="chip on">4등급</span><span class="chip on">3등급</span><span class="chip">2등급</span><span class="chip">1등급</span></div>`,

];

document.getElementById('g').innerHTML=S.map(s=>{
 let i=1;
 const nav=`<div class="nav">${s.back?'<span class="bk">←</span>':''}<b>${s.t}</b><span class="n">${i}</span></div>`;
 const body=s.secs.map(h=>`<div class="sec"><span class="n">${++i}</span>${h}</div>`).join('');
 const act=['홈','위험구간목록','위험구간목록','','','마이','마이',''][s.no-1]||'';
 const tb=['홈','위험구간목록','마이'],ic={홈:'⌂',위험구간목록:'⚠',마이:'☺'};
 let tabs='';
 let notes=s.n.slice();
 if(!s.back){
  tabs=`<div class="tabw"><span class="top">↑<small>TOP</small><span class="n">${++i}</span></span><div class="tabs">${tb.map(x=>`<div class="${x==act?'on':''}"><i>${ic[x]}</i>${x}</div>`).join('')}<span class="n">${++i}</span></div></div>`;
  notes=notes.concat([['TOP 버튼','스크롤을 내리면 오른쪽 아래(탭 바 위)에 나타남. 누르면 화면 맨 위로 이동, 맨 위에서는 숨김'],['하단 탭 바','홈 · 위험구간목록 · 마이 3개 고정. 로그인이 없어 어디서나 자유롭게 이동 가능']]);
 } else {
  notes=notes.concat([['탭바 숨김','푸시로 진입하는 전체화면이라 하단 탭 바가 보이지 않음. 좌상단 ← 로 이전 화면 복귀']]);
 }
 const notesHtml=notes.map((x,k)=>`<li><span class="nb">${k+1}</span><div><b>${x[0]}</b><span>${x[1]}</span></div></li>`).join('');
 return `<section><div class="hd"><b>${s.no}</b><strong>${s.t}</strong><span>${s.s}</span></div><div class="fr"><div class="bar"></div>${nav}${body}${tabs}</div><ul class="nt">${notesHtml}</ul></section>`;
}).join('');
