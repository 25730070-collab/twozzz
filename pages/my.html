<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safe Drive · 마이</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="my" data-base="">
<div class="app">
  <header class="app-header">
    <a class="logo" href="../index.html">Safe Drive</a>
    <a class="chip" id="userChip" href="signup.html">가입</a>
  </header>

  <main class="page">
    <h2>마이</h2>
    <div class="profile" style="margin-top:10px">
      <span class="avatar">☺</span>
      <div><b id="profileName">비회원</b><span class="mu" id="profileSub">닉네임·이메일만으로 가입할 수 있어요</span></div>
      <button class="chip" id="profileBtn">회원가입</button>
    </div>
    <div class="pv-stats">
      <div><b id="statDrill">0</b><span class="mu">모의주행 횟수</span></div>
      <div><b id="statPoints">0</b><span class="mu">익힌 주의 지점</span></div>
    </div>

    <div class="tabs">
      <button class="on" data-tab="fav">즐겨찾기 <span id="favCount">0</span></button>
      <button data-tab="recent">최근검색 <span id="recentCount">0</span></button>
      <button data-tab="drill">연습기록 <span id="drillCount">0</span></button>
    </div>

    <div class="pane on" data-pane="fav">
      <div class="state" id="state-save-empty">
        <p class="mu">저장한 경로가 없어요</p>
        <button class="btn" onclick="location.href='../index.html'">경로 비교하러 가기</button>
      </div>
      <div class="list-box" id="favoriteList" style="margin-top:10px"></div>
    </div>

    <div class="pane" data-pane="recent">
      <div class="state" id="state-recent-empty">
        <p class="mu">최근 검색 기록이 없어요</p>
        <button class="btn" onclick="location.href='../index.html'">홈에서 경로 검색하기</button>
      </div>
      <div id="recentWrap" style="margin-top:10px">
        <div class="list-box" id="recentList"></div>
        <div class="row">
          <span class="mu">최대 10건, 검색 시각순 보관</span>
          <button class="chip" id="clearAllRecent" style="margin-left:auto">전체 삭제</button>
        </div>
      </div>
    </div>

    <div class="pane" data-pane="drill">
      <div class="state" id="state-drill-empty">
        <p class="mu">아직 모의주행 기록이 없어요</p>
        <button class="btn" onclick="location.href='../index.html'">연습 코스 보러가기</button>
      </div>
      <div id="drillWrap" style="margin-top:10px">
        <div class="list-box" id="drillList"></div>
        <div class="row">
          <span class="mu">완료한 모의주행이 자동으로 쌓여요</span>
          <button class="chip" id="clearAllDrill" style="margin-left:auto">전체 삭제</button>
        </div>
      </div>
    </div>

    <!-- 하단 큐레이션 -->
    <section class="section">
      <div class="section-hd"><h3>추천 연습 코스</h3></div>
      <div class="list-box" id="courseList"></div>
    </section>
    <section class="section">
      <div class="section-hd"><h3>상황별 대처법</h3></div>
      <div id="learnList"></div>
    </section>
  </main>

  <footer class="foot">
    즐겨찾기·최근검색·연습기록은 이 기기(LocalStorage)에만 저장돼요<br>
    Safe Drive · 도로교통공단 사고 데이터 기반
  </footer>

  <nav class="tabbar">
    <a href="../index.html"><i>⌂</i>홈</a>
    <a href="list.html"><i>⚠</i>위험 구간</a>
    <a href="my.html" class="on"><i>☺</i>마이</a>
  </nav>
</div>

<script src="../js/mock.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/config.js"></script>
<script src="../js/config.local.js"></script>
<script src="../js/common.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/data.js"></script>
<script src="../js/route-api.js"></script>
<script src="../js/my.js"></script>
</body>
</html>
