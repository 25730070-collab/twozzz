<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../asset/icon-192.png">
  <link rel="apple-touch-icon" href="../asset/icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Safe Drive">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Drive · 경로 비교</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="compare" data-base="">
<div class="app has-cta">
  <header class="app-header"></header>
  <div class="subhead"><button class="ic" id="backBtn" data-fallback="../index.html" aria-label="뒤로">←</button><b id="headerTitle">경로 비교</b><span class="right"></span></div>

  <main class="page">
    <div class="route-title"><h1 id="summary">출발 → 도착</h1></div>
    <div class="row" id="favRow"><button class="chip fav-btn" id="favRoute" data-fav="false">경로 즐겨찾기</button><button class="chip" id="shareRoute"></button></div>
    <div class="state" id="state-loading"><div class="skel skel-map"></div><p class="mu" id="stageText" role="status" aria-live="polite">경로를 계산하는 중…</p></div>

    <div class="routemap skel" id="cmpMap" hidden></div>
    <div class="verdict" id="verdict" hidden></div>
    <div class="rt-grid" id="routeCards"></div>
    <p class="mu rt-names" id="selNames"></p>
    <p class="mu" id="basis" hidden style="margin-top:var(--sp3)"></p>
    <details class="cand" id="candBox" hidden>
      <summary>비교한 후보 경로 보기</summary>
      <ul class="cand-l" id="candList"></ul>
    </details>

    <section class="section" id="worstBox" hidden>
      <div class="section-hd"><h3>사고가 많았던 곳</h3></div>
      <div class="list-box" id="worstList"></div>
    </section>
  </main>


  <div class="cta-bar" id="ctaBar" hidden>
    <a class="btn" id="goPreview" href="#">예습하기</a>
    <a class="btn dk" id="goDrive" href="#">안내 시작</a>
  </div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/config.js"></script>
<script src="../js/config.local.js"></script>
<script src="../js/common.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/data.js"></script>
<script src="../js/route-api.js"></script>
<script src="../js/map.js"></script>
<script src="../js/compare.js"></script>
</body>
</html>
