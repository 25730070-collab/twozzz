<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Drive · 가는 길 예습</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="preview" data-base="">
<div class="app has-cta">
  <header class="app-header"></header>
  <div class="subhead"><button class="ic" id="backBtn" data-fallback="compare.html" aria-label="뒤로">←</button><b id="headerTitle">가는 길 예습</b><span class="right"></span></div>

  <main class="page">
    <div class="tabs" id="typeTabs" style="margin-top:0">
      <button data-type="safe" class="on">안전 경로</button>
      <button data-type="fast">빠른 경로</button>
    </div>
    <div class="routemap" id="pvMap" hidden></div>
    <div class="pv-stats" id="pvStats"></div>
    <div class="state" id="state-loading"><p class="mu">경로를 계산하는 중…</p></div>

    <section class="section">
      <div class="section-hd"><h3>지나는 순서</h3></div>
      <div class="list-box" id="timeline"></div>
    </section>
  </main>

  <footer class="foot">
    출처 · 도로교통공단 지자체별 교통사고 다발지역<br>
    데이터에 없는 곳이 안전하다는 뜻은 아니에요
  </footer>

  <div class="cta-bar">
    <a class="btn" id="goCompare" href="javascript:history.back()">경로 비교</a>
    <a class="btn dk" id="goDrive" href="#">안내 시작</a>
  </div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/config.js"></script>
<script src="../js/config.local.js"></script>
<script src="../js/common.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/data.js"></script>
<script src="../js/route-api.js"></script>
<script src="../js/map.js"></script>
<script src="../js/preview.js"></script>
</body>
</html>
