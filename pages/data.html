<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../asset/icon-192.png">
  <link rel="apple-touch-icon" href="../asset/icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Safe Drive">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Drive · 데이터 관리</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="data" data-base="">
<div class="app">
  <header class="app-header"></header>
  <div class="subhead"><button class="ic" id="backBtn" data-fallback="my.html" aria-label="뒤로">←</button><b>데이터 관리</b><span class="right"></span></div>

  <main class="page">
    <h1>데이터 관리</h1>
    <p class="page-lead">서비스 데이터와 내 데이터를 확인하고 내려받을 수 있어요</p>

    <div class="state on" id="state-loading"><p class="mu">불러오는 중…</p></div>
    <div class="pv-stats" id="dsStats"></div>
    <p class="mu" id="dsPnt" style="margin-top:var(--sp2);white-space:normal"></p>

    <section class="section">
      <div class="section-hd"><h3>데이터 파일</h3></div>
      <div class="list-box" id="dsList"></div>
      <button class="btn dk" id="dlAll">전체 내려받기 (JSON)</button>
    </section>

    <section class="section">
      <div class="section-hd"><h3>데이터 구분</h3></div>
      <div class="list-box" id="flagList"></div>
    </section>

    <section class="section">
      <div class="section-hd"><h3>필드 구분표</h3></div>
      <div class="list-box" id="fieldList"></div>
    </section>

    <section class="section">
      <div class="section-hd"><h3>데이터 점검</h3></div>
      <div class="box" style="margin-top:0" id="checkBox"></div>
    </section>

    <section class="section">
      <div class="section-hd"><h3>내 데이터 관리</h3></div>
      <div class="box" style="margin-top:0">
        <p class="mu">즐겨찾기·최근 검색·제보를 파일로 옮기거나 되돌려요. 가져오기는 형식이 맞는 새 항목만 추가해요</p>
        <div class="data-actions">
          <label class="btn" for="importFile" style="cursor:pointer">가져오기</label>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
          <button class="btn warn" id="clearBtn">모두 삭제</button>
        </div>
        <div class="state" id="state-confirm"><p class="note err">즐겨찾기·최근 검색·제보가 모두 삭제돼요. 계속할까요?</p>
          <div class="data-actions"><button class="btn" id="clearNo">취소</button><button class="btn dk" id="clearYes">삭제</button></div></div>
        <div class="state" id="state-result"><p class="note ok" id="resultMsg"></p></div>
        <div class="state" id="state-error"><p class="note err" id="errorMsg"></p></div>
      </div>
    </section>
  </main>


  <nav class="tabbar"></nav>
</div>

<script src="../js/storage.js"></script>
<script src="../js/common.js"></script>
<script src="../js/data.js"></script>
<script src="../js/datapage.js"></script>
</body>
</html>
