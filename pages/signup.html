<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../asset/icon-192.png">
  <link rel="apple-touch-icon" href="../asset/icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Safe Drive">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Drive · 회원가입</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="signup" data-base="">
<div class="app has-cta">
  <header class="app-header"></header>
  <div class="subhead"><button class="ic" id="backBtn" data-fallback="../index.html" aria-label="뒤로">←</button><b id="headerTitle">회원가입</b><span class="right"></span></div>

  <main class="page">
    <h1>닉네임과 이메일만<br>있으면 돼요</h1>
    <p class="page-lead">가입하면 이 기기에서 이름으로 즐겨찾기를 관리해요</p>

    <div class="field">
      <label for="nickname">닉네임<i aria-hidden="true">*</i></label>
      <input class="in" id="nickname" maxlength="10" placeholder="닉네임 입력" autocomplete="off">
      <p class="mu" id="nickHint">2~10자 (한글·영문·숫자)</p>
    </div>

    <div class="field">
      <label for="email">이메일<i aria-hidden="true">*</i></label>
      <div class="row">
        <input class="in" id="email" type="email" placeholder="example@email.com" autocomplete="off">
        <button class="btn" id="sendCode" disabled>인증번호 받기</button>
      </div>
    </div>

    <div class="field">
      <label for="code">인증번호<i aria-hidden="true">*</i> <span class="timer" id="timer"></span></label>
      <div class="row">
        <input class="in" id="code" inputmode="numeric" maxlength="6" placeholder="6자리 숫자" autocomplete="off">
        <button class="btn" id="verify" disabled>확인</button>
      </div>
    </div>

    <div class="state" id="state-code-sent"><p class="note"><span id="sentTo"></span> 로 인증번호를 보냈어요.<br>
      연습 화면이라 메일은 가지 않아요. 인증번호 <b id="demoCode"></b> 를 입력해 주세요</p></div>
    <div class="state" id="state-code-error"><p class="note err">인증번호가 맞지 않아요. 다시 확인해 주세요</p></div>
    <div class="state" id="state-code-expired"><p class="note err">입력 시간이 지났어요. 인증번호를 다시 받아 주세요</p></div>
    <div class="state" id="state-verified"><p class="note ok">이메일 인증이 완료됐어요</p></div>
    <div class="state" id="state-join-done">
      <p class="note ok">가입이 완료됐어요. 환영해요!</p>
      <button class="btn dk" onclick="location.href='my.html'">마이로 이동</button>
    </div>
  </main>

  <div class="cta-bar"><button class="btn dk" id="join" disabled>가입하기</button></div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/common.js"></script>
<script src="../js/signup.js"></script>
</body>
</html>
