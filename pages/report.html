<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Drive · 위험 구간 제보</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="report" data-base="">
<div class="app has-cta">
  <header class="app-header">
    <a class="logo" href="../index.html">Safe Drive</a>
    <a class="chip" id="userChip" href="signup.html">가입</a>
  </header>
  <div class="subhead"><button class="ic" id="backBtn" data-fallback="list.html" aria-label="뒤로">←</button><b id="headerTitle">위험 구간 제보</b><span class="right"></span></div>

  <main class="page">
    <h2>위험하다고 느낀 곳을 알려 주세요</h2>
    <p class="mu">제보한 구간은 목록에 <span class="src u">U</span> 태그로 표시되고, 이 기기에만 저장돼요</p>

    <div class="field"><label for="roadName">도로명 / 구간 이름 *</label>
      <input class="in" id="roadName" maxlength="30" placeholder="예: 테헤란로 3번 구간" autocomplete="off"></div>
    <div class="field"><label for="address">주소 *</label>
      <input class="in" id="address" maxlength="60" placeholder="예: 서울특별시 강남구 논현동" autocomplete="off"></div>
    <div class="field"><label for="riskLevel">내가 느낀 위험도 *</label>
      <select id="riskLevel"><option value="1">1등급 (낮음)</option><option value="2">2등급</option><option value="3">3등급</option><option value="4">4등급 (매우 높음)</option></select></div>
    <div class="field"><label for="accidentCount">알고 있는 사고 건수 (선택)</label>
      <input class="in" id="accidentCount" inputmode="numeric" maxlength="3" placeholder="모르면 비워 두세요 → '정보 없음'으로 표시돼요" autocomplete="off"></div>

    <div class="state" id="state-err"><p class="note err" id="errMsg"></p></div>
    <div class="state" id="state-done"><p class="note ok">제보가 저장됐어요. 목록의 <b>U</b> 태그로 확인할 수 있어요</p>
      <button class="btn dk" onclick="location.href='list.html'">목록에서 확인하기</button></div>
    <p class="note">정식 서비스에서는 서버에 저장되지만, 지금은 이 기기(LocalStorage)에만 저장돼요. 제보 위치(좌표)는 받지 않아요.</p>
  </main>

  <div class="cta-bar"><button class="btn dk" id="submit">제보하기</button></div>

<script src="../js/storage.js"></script>
<script src="../js/common.js"></script>
<script src="../js/report.js"></script>
</body>
</html>
