<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">

<body data-page="detail" data-base="">
<div class="app has-cta">
  <header class="app-header">
    <a class="logo" href="../index.html">Safe Drive</a>
    <a class="chip" id="userChip" href="signup.html">가입</a>
  </header>
  <div class="subhead"><button class="ic" id="backBtn" data-fallback="list.html" aria-label="뒤로">←</button><b id="headerTitle">구간 상세</b><span class="right"></span></div>

  <main class="page">
    <div class="img" id="mapView"></div>
    <h2 style="margin-top:12px"><span class="roadName"></span> <span class="bg r1 riskLevel" id="riskBadge" data-risk="1">1등급</span> <span id="srcBadge"></span></h2>
    <p class="mu address"></p>

    <div class="kv">
      <div><b id="accCell">0</b><span class="mu">사고 건수</span></div>
      <div><b id="yearCell">-</b><span class="mu">기준 연도</span></div>
    </div>

    <div class="box" id="extraBox" hidden>
      <b>피해 현황</b>
      <div class="kv" id="extraList" style="margin-top:8px"></div>
    </div>

    <p class="meta-sum">위험등급은 수집한 구간의 사고 건수를 비교한 상대 등급이에요</p>

    <div class="state" id="state-save-done"><p class="note ok"></p></div>

    <section class="section">
      <div class="section-hd"><h3 id="relatedTitle">다른 구간</h3></div>
      <div class="list-box" id="relatedList"></div>
    </section>
  </main>

  <footer class="foot">
    Safe Drive · 도로교통공단 지자체별 교통사고 다발지역 데이터 기반<br>
    위험 구간은 공공데이터이며, 데이터에 없는 곳이 안전하다는 뜻은 아니에요
  </footer>

  <div class="cta-bar">
    <a class="btn" href="list.html">위험 구간 전체</a>
    <button class="btn dk" id="favBtn" data-fav="false">☆ 구간 즐겨찾기</button>
  </div>
</div>

<script src="../js/storage.js"></script>
