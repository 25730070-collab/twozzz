<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Drive · 위험 구간</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="list" data-base="">
<div class="app">
  <header class="app-header">
    <a class="logo" href="../index.html">Safe Drive</a>
    <a class="chip" id="userChip" href="signup.html">가입</a>
  </header>

  <!-- 조건 + 필터 : 헤더 아래 스티키 -->
  <div class="subbar">
    <div class="row" style="margin:0">
      <b>위험 구간</b><span class="mu">전체 구간 보기</span>
    </div>
    <div class="row">
      <div class="dropdown">
        <button class="chip" id="filterRiskBtn">위험등급 ▾</button>
        <div class="panel" id="filterRiskPanel">
          <button class="chip opt" data-risk-opt="4">4등급</button>
          <button class="chip opt" data-risk-opt="3">3등급</button>
          <button class="chip opt" data-risk-opt="2">2등급</button>
          <button class="chip opt" data-risk-opt="1">1등급</button>
        </div>
      </div>
      <div class="dropdown">
        <button class="chip" id="filterGuBtn">지역 ▾</button>
        <div class="panel" id="filterGuPanel"></div>
      </div>
      <div class="dropdown">
        <button class="chip" id="filterSrcBtn">구분 ▾</button>
        <div class="panel" id="filterSrcPanel">
          <button class="chip opt" data-src-opt="static">J · 기본 구간</button>
          <button class="chip opt" data-src-opt="api">A · 추가 구간</button>
          <button class="chip opt" data-src-opt="user">U · 내 제보</button>
        </div>
      </div>
      <div class="dropdown">
        <button class="chip" id="filterYearBtn">연도 ▾</button>
        <div class="panel" id="filterYearPanel"></div>
      </div>
      <button class="chip" id="sortChip">기본순 ▾</button>
      <button class="chip bd" id="resetFilter" style="margin-left:auto">초기화</button>
    </div>
  </div>

  <main class="page">
    <div class="searchbar"><input id="q" type="search" placeholder="동·도로명·구 (예: 강남구 논현)" aria-label="구간 검색"><a class="btn" href="report.html" style="max-width:96px">+ 제보</a></div>
    <p class="mu" id="resultCount" style="margin-bottom:6px"></p>
    <p class="note" id="srcNote" hidden></p>

    <div class="state" id="state-loading"><p class="mu">불러오는 중…</p></div>
    <div class="state" id="state-empty"></div>
    <div class="state" id="state-error">
      <p class="mu">위험 구간 데이터를 불러오지 못했어요</p>
      <button class="btn" id="retryList">다시 시도</button>
      <p class="note">오류 상태에서도 즐겨찾기·최근검색은 그대로 유지됩니다</p>
    </div>

    <div id="resultWrap">
      <div class="list-box" id="resultList"></div>
      <button class="btn" id="moreBtn" hidden>더 보기</button>
    </div>

  </main>

  <footer class="foot">
    Safe Drive · 도로교통공단 지자체별 교통사고 다발지역 데이터 기반<br>
    위험 구간은 공공데이터이며, 데이터에 없는 곳이 안전하다는 뜻은 아니에요
  </footer>

  <nav class="tabbar">
    <a href="../index.html">홈</a>
    <a href="list.html" class="on">위험 구간</a>
    <a href="my.html">마이</a>
  </nav>
</div>

<script src="../js/storage.js"></script>
<script src="../js/common.js"></script>
<script src="../js/data.js"></script>
<script src="../js/list.js"></script>
</body>
</html>
